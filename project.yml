# XcodeGen spec for the iOS app. `docs/technical.md` §1 and §2: one SPM package
# plus a thin `App/` folder, generated by xcodegen.
#
#   xcodegen && open Compass.xcodeproj
#
# The package and its tests build and run without any of this, on macOS, with no
# simulator and no developer account:
#
#   swift test
#
# `App/` is the composition root and holds nothing else. Every line of product
# code lives in the package targets, which is what keeps the boundary in §2
# enforced by the compiler rather than by review.
name: Compass
options:
  bundleIdPrefix: dev.farros.compass
  deploymentTarget:
    iOS: "18.0"
packages:
  compass:
    path: .
targets:
  Compass:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: compass
        product: CompassUI
      - package: compass
        product: CompassInfrastructure
      - package: compass
        product: CompassDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.farros.compass
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: Compass
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # `App/Assets.xcassets/AppIcon.appiconset` — one 1024 x 1024 image per
        # iOS 18 appearance: default, dark and tinted. All three are opaque. The
        # App Store rejects an alpha channel on an app icon, and the design is
        # explicit that the ground is a solid rect in every appearance, so the
        # PNGs are re-encoded without one on the way into the catalogue rather
        # than shipped as exported.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# The same missing simulator runtime blocks the icon, and it is worth writing
# down because the error names neither the icon nor the runtime as the fix:
#
#   App/Assets.xcassets: error: No simulator runtime version from ["22E238"]
#   available to use with iphonesimulator SDK version 23C57
#
# 22E238 is iOS 18.4, the only runtime installed. 23C57 is the iOS 26.2 SDK, the
# only SDK Xcode 26.3 ships. `actool` refuses to compile an **app icon** for a
# simulator SDK with no matching runtime — narrowed to exactly that: the same
# catalogue compiles cleanly the moment `ASSETCATALOG_COMPILER_APPICON_NAME` is
# empty, and it fails identically with a single default-appearance image, so it
# is not the three iOS 18 appearances and it is not this Contents.json.
#
# Installing the iOS 26.2 simulator runtime (Xcode > Settings > Components)
# fixes it, and is the same one-line fix as the destination problem below.
# Nothing in this file can, and nothing in this file should try — the catalogue
# is correct, and a second loose-PNG icon path added to work around a missing
# download would be a permanent fixture bought for a temporary problem.
#
# To build on this machine *without* the icon, for a screen change you want to
# see now, override it on the command line and do not commit the override:
#
#   xcodebuild … ASSETCATALOG_COMPILER_APPICON_NAME=""

# A shared scheme, so Xcode's Run button, CI and the simulator tooling all have
# something to act on. Keep it.
#
# It is NOT the fix for "no simulator destination", and an earlier version of
# this comment said it was. That was disproved directly: a bare xcodegen iOS app
# with no `schemes:` block and no package dependency produces the identical
# "Supported platforms for the buildables in the current scheme is empty". The
# scheme was never the variable.
#
# The real cause is environmental, and it is on this machine rather than in this
# file. Xcode 26.3 (17C529) ships only the iOS 26.2 SDK, and the sole simulator
# runtime installed is iOS 18.4 — so no simulator destination for the SDK the
# toolchain builds against exists. With the scheme in place,
# `-showdestinations` still lists no eligible destination and says of the
# placeholder: "iOS 26.2 is not installed." Installing the matching iOS 26.2
# simulator runtime (Xcode > Settings > Components) is what makes
# `-destination 'platform=iOS Simulator,…'` work; nothing in this file can.
#
# Until then, this builds the app for the simulator on this machine:
#
#   xcodebuild -project Compass.xcodeproj -target Compass -sdk iphonesimulator26.2 \
#     -configuration Debug CONFIGURATION_BUILD_DIR=$PWD/.build/products build
#
# `-target` with an explicit `-sdk` bypasses destination resolution entirely,
# which is why it succeeds where `-scheme -destination` cannot.
schemes:
  Compass:
    build:
      targets:
        Compass: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
