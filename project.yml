# XcodeGen spec for the iOS app. `docs/technical.md` §1 and §2: one SPM package
# plus a thin `App/` folder, generated by xcodegen.
#
#   xcodegen && open Compass.xcodeproj
#
# The package and its tests build and run without any of this, on macOS, with no
# simulator and no developer account:
#
#   swift test
#
# `App/` is the composition root and holds nothing else. Every line of product
# code lives in the package targets, which is what keeps the boundary in §2
# enforced by the compiler rather than by review.
name: Compass
options:
  bundleIdPrefix: dev.farros.compass
  deploymentTarget:
    iOS: "18.0"
packages:
  compass:
    path: .
targets:
  Compass:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: compass
        product: CompassUI
      - package: compass
        product: CompassInfrastructure
      - package: compass
        product: CompassDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.farros.compass
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: Compass
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # `App/Assets.xcassets/AppIcon.appiconset` — one 1024 x 1024 image per
        # iOS 18 appearance: default, dark and tinted. All three are opaque. The
        # App Store rejects an alpha channel on an app icon, and the design is
        # explicit that the ground is a solid rect in every appearance, so the
        # PNGs are re-encoded without one on the way into the catalogue rather
        # than shipped as exported.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# Building it, re-measured on this machine on 2026-07-31. This works, icon and
# all:
#
#   xcodegen && xcodebuild -project Compass.xcodeproj -scheme Compass \
#     -destination 'platform=iOS Simulator,name=iPhone 17' -configuration Debug \
#     CONFIGURATION_BUILD_DIR=$PWD/.build/products build
#
# **Never pass `ASSETCATALOG_COMPILER_APPICON_NAME=""`.** The comment that stood
# here until now instructed exactly that, to route around a simulator runtime
# that was missing when it was written. It is not missing: `simctl list runtimes`
# reports iOS 26.3 (23D8133) beside iOS 18.4, `-showdestinations` lists twelve
# eligible simulators, and the build above emits `AppIcon60x60@2x`, `Assets.car`
# and `CFBundleIconName = AppIcon`. Following the old advice today ships an
# iconless app to fix a problem that no longer exists.
#
# If any of that breaks again, re-measure — `xcrun simctl list runtimes`,
# `xcodebuild -showdestinations` — and rewrite this from what you see. Keep it
# this short: the old version went stale unnoticed partly because it was long
# enough to read as settled.

# A shared scheme, so Xcode's Run button, CI and the simulator tooling all have
# something to act on. Keep it.
schemes:
  Compass:
    build:
      targets:
        Compass: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
