# XcodeGen spec for the iOS app. `docs/technical.md` §1 and §2: one SPM package
# plus a thin `App/` folder, generated by xcodegen.
#
#   xcodegen && open Compass.xcodeproj
#
# The package and its tests build and run without any of this, on macOS, with no
# simulator and no developer account:
#
#   swift test
#
# `App/` is the composition root and holds nothing else. Every line of product
# code lives in the package targets, which is what keeps the boundary in §2
# enforced by the compiler rather than by review.
name: Compass
options:
  bundleIdPrefix: dev.farros.compass
  deploymentTarget:
    iOS: "18.0"
packages:
  compass:
    path: .
targets:
  Compass:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: compass
        product: CompassUI
      - package: compass
        product: CompassInfrastructure
      - package: compass
        product: CompassDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.farros.compass
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: Compass
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"

# Without this block xcodegen writes no `.xcscheme` at all, and a project with
# no scheme has no buildables — so `xcodebuild -scheme Compass -destination
# 'platform=iOS Simulator,…'` fails with "Unable to find a destination matching
# the provided destination specifier", and `-showdestinations` reports
# "Supported platforms for the buildables in the current scheme is empty" and
# offers only an ineligible `Any iOS Device` placeholder. Only
# `xcodebuild -target Compass -sdk iphonesimulator` worked, which is the one
# route neither Xcode's Run button, nor CI, nor the iOS-simulator tooling takes.
schemes:
  Compass:
    build:
      targets:
        Compass: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
